name: Build
on:
  push: { branches: [ "main" ] }
  pull_request: { branches: [ "main" ] }

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-manual:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    steps:
      - uses: actions/checkout@v3
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.72.2
      - name: mkdocs
        env:
          # Since no browser is installed during this CI run, plotly fails to
          # produce HTML output, see https://github.com/plotly/plotly.py/blob/2c2dd6ab2eeff73c782457f33c590c1d09a97625/packages/python/plotly/plotly/io/_renderers.py#L532
          PLOTLY_RENDERER: browser
        run: |
          pixi run doc --strict
          # Disable further processing by GitHub
          touch generated/website/.nojekyll
      # The website is checked for broken links by the linkcheck job. We hand
      # it the site we just built so that it does not have to build it again.
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: generated/website
          include-hidden-files: true
          retention-days: 1
        if: ${{ matrix.os == 'ubuntu-latest' }}
      - uses: JamesIves/github-pages-deploy-action@v4.3.3
        with:
          branch: gh-pages
          folder: generated/website
          target-folder: ""
          single-commit: true
        if: ${{ github.event_name == 'push' && matrix.os == 'ubuntu-latest' }}

  # Broken links are reported in a job of their own, so that a website that
  # builds is published even when a site we link to is unreachable. When this
  # job is red, somebody has to decide whether the link has to be fixed or
  # whether the failure is a temporary problem of the other side; it must
  # therefore not be a required check.
  linkcheck:
    runs-on: ubuntu-latest
    needs: build-manual
    steps:
      - uses: actions/checkout@v3
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.72.2
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: generated/website
      - name: detect broken links
        shell: bash -l {0}
        # We only check links on Linux since we do not want to get flagged
        # because of too many requests by the target websites.
        run: |
          python -m http.server 8880 --directory generated/website &
          sleep 1
          # We check for broken links:
          # * ignore fonts.gstatic.com which is mentioned by a link preconnect tag that linkchecker does not parse correctly.
          # * ignore DOIs since some publishers ban GitHub or bots.
          # * ignore datascience.codata.org because this host intermittently times out.
          # * ignore go-fair.org because it returns 403 for automated requests.
          # * ignore ki.si because its certificate chain is misconfigured (missing intermediate certificate), which fails strict SSL verification.
          pixi run linkchecker --check-extern --no-robots --ignore fonts.gstatic.com --ignore doi.org --ignore datascience.codata.org http://localhost:8880/ --ignore mybinder.org --ignore osti.gov --ignore go-fair.org --ignore ki.si --no-warnings
